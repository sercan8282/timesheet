<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Timesheet Management System</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <!-- Force 24-hour time format -->
    <script>
      // Force en-GB locale for time inputs to ensure 24-hour format
      document.documentElement.lang = 'en-GB';
    </script>

    <!-- Navigation -->
    <nav
      class="navbar navbar-expand-lg navbar-dark bg-primary"
      id="mainNav"
      style="display: none"
    >
      <div class="container-fluid">
        <a class="navbar-brand" href="#" onclick="app.loadPage('dashboard')">
          <i class="bi bi-calendar-check"></i> Timesheet System
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav me-auto">
            <li class="nav-item" id="nav-dashboard">
              <a class="nav-link" href="#" onclick="app.loadPage('dashboard')">
                <i class="bi bi-house"></i> Dashboard
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#" onclick="app.loadPage('history')">
                <i class="bi bi-clock-history"></i> History
              </a>
            </li>
            <li class="nav-item" id="nav-weekly-hours">
              <a
                class="nav-link"
                href="#"
                onclick="app.loadPage('weekly-hours')"
              >
                <i class="bi bi-bar-chart"></i> Weekly Hours
              </a>
            </li>
            <li class="nav-item" id="nav-admin" style="display: none">
              <a class="nav-link" href="#" onclick="app.loadPage('admin')">
                <i class="bi bi-gear"></i> Admin
              </a>
            </li>
          </ul>
          <ul class="navbar-nav">
            <li class="nav-item dropdown">
              <a
                class="nav-link dropdown-toggle"
                href="#"
                id="userDropdown"
                role="button"
                data-bs-toggle="dropdown"
              >
                <i class="bi bi-person-circle"></i> Welcome,
                <span id="userName"></span>
              </a>
              <ul class="dropdown-menu dropdown-menu-end">
                <li>
                  <a
                    class="dropdown-item"
                    href="#"
                    onclick="app.loadPage('change-password')"
                  >
                    <i class="bi bi-key"></i> Change Password
                  </a>
                </li>
                <li><hr class="dropdown-divider" /></li>
                <li>
                  <a class="dropdown-item" href="#" onclick="app.logout()">
                    <i class="bi bi-box-arrow-right"></i> Logout
                  </a>
                </li>
              </ul>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Main Content -->
    <div id="app"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/dashboard.js"></script>
    <script src="/js/history.js"></script>
    <script src="/js/weekly-summary.js"></script>
    <script src="/js/admin.js"></script>
    <script src="/js/app.js"></script>
  </body>
</html>
